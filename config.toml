baseurl = "https://www.subcul-science.com"
DefaultContentLanguage = "ja"
defaultContentLanguageInSubdir = false
title = "サブカル科学研究会のブログ"
theme = "beautifulhugo"
hasCJKLanguage = true
pygmentsStyle = "trac"
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
#pygmentsUseClassic = true
#pygmentOptions = "linenos=inline"
#disqusShortname = "XXX"
#googleAnalytics = "XXX"

[languages]
  [languages.ja]
    languageName = "日本語"
    languageCode = "ja-JP"
    weight = 1
    title = "サブカル科学研究会のブログ"
    [languages.ja.params]
      subtitle = "数理最適化、自然言語処理、雑記"

  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    weight = 2
    title = "Subculture Science Research Group's Blog"
    [languages.en.params]
      subtitle = "Mathematical optimization, natural language processing, and more"

[Params]
#  homeTitle = "Beautiful Hugo Theme" # Set a different text for the header on the home page
  mainSections = ["post","posts"]
  logo = "img/logo.png" # Expecting square dimensions
  favicon = "img/favicon.ico"
  dateFormat = "Mon Jan 2 2006"
  commit = false
  rss = true
  comments = true
  readingTime = true
  wordCount = true
  useHLJS = true
  socialShare = true
  delayDisqus = true
  showRelatedPosts = true
#  hideAuthor = true
#  gcse = "012345678901234567890:abcdefghijk" # Get your code from google.com/cse. Make sure to go to "Look and Feel" and change Layout to "Full Width" and Theme to "Classic"

#[[Params.bigimg]]
#  src = "img/triangle.jpg"
#  desc = "Triangle"
#[[Params.bigimg]]
#  src = "img/sphere.jpg"
#  desc = "Sphere"
#  # position: see values of CSS background-position.
#  position = "center top"
#[[Params.bigimg]]
#  src = "img/hexagon.jpg"
#  desc = "Hexagon"

[Author]
  # Set only your "username" for default hosts and full URLs otherwise (e.g., "https://MyGitLab.org/username")
  name = "近藤綾乃"
  twitter = "Vx5tN"
  youtube = "user/username" # or channel/channelname
  soundcloud = "username"
  discord = "invite code (https://discord.gg/XXXXXXX)"

