[build]
  command = "hugo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.142.0"

[dev]
  command = "hugo server -w --bind 0.0.0.0 -p 1313"
  targetPort = 1313
  port = 8888
  framework = "#custom"

# === LP rename redirects (2026-06-05) ===
# 旧 ad のリンク先。2026-08-15 に simple → rich 統合したので **rich に直結**させる
# (simple 経由にすると 301 が 2 段になる)
[[redirects]]
  from = "/lp/x-fav-lp/"
  to = "/lp/x-fav-rich/"
  status = 301
  force = true

# 現 ad のリンク先。rich と rich-visual の 50/50 実験中は Edge Function が
# /x-fav/ を先に処理する。Edge が動かない場合のみ下の 301 で rich に着地する。
# rich-visual のイベントを受けるサーバ (LP_VARIANT_IDS) を先に公開すること。
[[redirects]]
  from = "/x-fav/"
  to = "/lp/x-fav-rich/"
  status = 301
  force = true

# === LP 統合 (2026-08-15) ===
# A/B は 2026-06-20 に **rich 勝者**と判定済み (x-fav-gellery docs:
# lp-engagement-improvement-2026-06)。広告リンク先は 07-27 に /x-fav/ (rich 固定) へ
# 変更済みなので、ここで拾うのは**オーガニック流入と既存リンクの取りこぼし**。
# content/lp/x-fav-simple.md は残すが、force = true でこの 301 が勝つ。
[[redirects]]
  from = "/lp/x-fav-simple/"
  to = "/lp/x-fav-rich/"
  status = 301
  force = true

# === A/B test ===
# /x-fav/ と /x-fav-ab/ は Edge Function (netlify/edge-functions/x-fav-ab.ts)
# が rich / rich-visual へ cookie 固定で 50/50 に割り付ける。
# UTM クエリは Edge が透過し、LP から /install/ios へ utm_term で variant を渡す。
# /lp/x-fav-rich-visual/ には redirect を追加しない。
