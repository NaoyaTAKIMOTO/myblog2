[build]
  command = "hugo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.142.0"

[dev]
  command = "hugo server -w --bind 0.0.0.0 -p 1313"
  targetPort = 1313
  port = 8888
  framework = "#custom"

# === LP rename redirects (2026-06-05) ===
# 旧 ad のリンク先。2026-08-15 に simple → rich 統合したので **rich に直結**させる
# (simple 経由にすると 301 が 2 段になる)
[[redirects]]
  from = "/lp/x-fav-lp/"
  to = "/lp/x-fav-rich/"
  status = 301
  force = true

# 現 ad のリンク先。**2026-09-16: ヒーロー訴求 A/B (WS-3) で splitter に向ける。**
#
# まず Edge Function (x-fav-ab.ts) が `/x-fav/` を拾って 302 で pain/gain に割る。
# ここは **precedence が不確実なときの fallback** で、redirect が勝っても
# `/x-fav-ab/` (splitter) に着くので A/B は成立する (その場合は 301 + 302 の 2 hop)。
# **テスト終了後は `/lp/x-fav-rich/` に戻す。**
#
# ⚠️ apex → www (Netlify のドメイン正規化) の 1 hop は解消できない (2026-08-19 実測)。
[[redirects]]
  from = "/x-fav/"
  to = "/x-fav-ab/"
  status = 301
  force = true

# === LP 統合 (2026-08-15) ===
# A/B は 2026-06-20 に **rich 勝者**と判定済み (x-fav-gellery docs:
# lp-engagement-improvement-2026-06)。広告リンク先は 07-27 に /x-fav/ (rich 固定) へ
# 変更済みなので、ここで拾うのは**オーガニック流入と既存リンクの取りこぼし**。
# content/lp/x-fav-simple.md は残すが、force = true でこの 301 が勝つ。
[[redirects]]
  from = "/lp/x-fav-simple/"
  to = "/lp/x-fav-rich/"
  status = 301
  force = true

# === A/B test ===
# 2026-06 の rich/simple は 2026-08-15 に rich 勝者で終了。
# **2026-09 から creative x LP の 2x2 A/B に転用している**:
# /x-fav-ab/ の Edge Function (netlify/edge-functions/x-fav-ab.ts) が
# /lp/x-fav-pain/ または /lp/x-fav-gain/ に 50/50 で 302 リダイレクトする。
# UTM クエリは保持される (広告リンクの utm_content = creative アームが
# 振り分け先まで届かないとセルが割れない)。
#
# ⚠️ 新アームの 2 パスには **redirect ルールを足さないこと**。上の
# /lp/x-fav-simple/ のような force = true の 301 を当てると 302 の後に
# さらに 1 段増え、着地率が落ちる。
#   → x-fav-gellery docs/implementation-plans/ad-ab-creative-lp-2026-09.md
